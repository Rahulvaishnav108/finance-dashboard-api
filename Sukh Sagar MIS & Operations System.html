<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukh Sagar MIS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#14213d;--mu:#64708a;--bd:#e1e6ee;--ac:#1b4fd8;--ok:#13795b;--wa:#b45309;--er:#c0262d;--sb:#0f1b3a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1220;--card:#161d30;--tx:#e8ecf5;--mu:#93a0bd;--bd:#27314a;--ac:#6d93ff;--ok:#3ecf9e;--wa:#f5b04c;--er:#ff7b80;--sb:#090e1c}}
:root[data-theme=dark]{--bg:#0d1220;--card:#161d30;--tx:#e8ecf5;--mu:#93a0bd;--bd:#27314a;--ac:#6d93ff;--ok:#3ecf9e;--wa:#f5b04c;--er:#ff7b80;--sb:#090e1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
aside{width:210px;background:var(--sb);color:#cfd8f0;padding:16px 10px;flex-shrink:0}
aside h1{font-size:15px;margin:0 8px 16px;color:#fff}aside h1 small{display:block;font-weight:400;color:#8b9ac0;font-size:11px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:7px;cursor:pointer;font:inherit}
aside button:hover{background:#ffffff14}aside button.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:18px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
header h2{margin:0;font-size:20px}
select,input,button.b{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}button.b.g{background:var(--card);color:var(--tx);border-color:var(--bd)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:0}
.k small{color:var(--mu);display:block}.k b{font-size:22px}
.card h3{margin:0 0 10px;font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card{width:100%;max-width:400px}#modal label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}#modal input,#modal select{width:100%}
textarea{width:100%;min-height:110px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:8px}
svg text{fill:var(--mu);font-size:10px}
@media(max-width:720px){#app{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto;padding:8px}aside h1{display:none}aside button{white-space:nowrap;width:auto}}
aside p{margin:14px 8px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6f7fa6}
#chat{max-height:50vh;overflow-y:auto}.m{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:88%}.m.u{background:var(--ac);color:#fff;margin-left:auto}.m.b{background:var(--bd)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--ac) 13%,var(--bg)))}
.login-box{width:min(100%,420px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:24px;box-shadow:0 18px 50px #10182818}
.login-box h1{font-size:22px;margin:0 0 4px}.login-box p{color:var(--mu);margin:0 0 18px}.login-box label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px}.login-box input{width:100%}.login-box .b{width:100%;margin-top:14px}.login-demo{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}.login-demo summary{cursor:pointer;color:var(--mu)}.login-demo p{font-size:12px;margin:8px 0 0}
@media(max-width:720px){aside p{display:none}}
@media print{aside,header button,header select{display:none}}
</style></head><body>
<div id="login"></div><div id="app"><aside id="nav"></aside><main><header><h2 id="ttl"></h2><div id="act" style="display:flex;gap:8px;flex-wrap:wrap"></div></header><div id="v"></div></main></div>
<div id="modal"><div class="card" id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),num=n=>Math.round(n).toLocaleString('en-IN');
const today=new Date().toISOString().slice(0,10),dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)},validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s;
const localApi=['localhost','127.0.0.1'].includes(location.hostname)||location.hostname.endsWith('.csb.app');
let S,role='',currentUser=null,view='dash';
const ACCOUNTS={admin:{name:'Sukh Sagar Admin',role:'Admin',password:'admin123'},management:{name:'Management',role:'Management',password:'manage123'},mis:{name:'MIS Executive',role:'MIS Executive',password:'mis123'},production:{name:'Production User',role:'Production',password:'prod123'},finance:{name:'Finance User',role:'Finance',password:'finance123'},sales:{name:'Sales User',role:'Sales',password:'sales123'},store:{name:'Store User',role:'Store',password:'store123'}};
const NAV={dash:['Dashboard','Admin,Management,MIS Executive,Production,Finance,Sales,Store'],prod:['Production','Admin,MIS Executive,Production'],inv:['Inventory Ledger','Admin,MIS Executive,Store,Production'],sales:['Sales & Invoices','Admin,MIS Executive,Finance,Sales'],ord:['Orders','Admin,MIS Executive,Sales,Production'],pur:['Purchases','Admin,MIS Executive,Finance,Store'],imp:['Excel/CSV Import','Admin,MIS Executive'],rep:['Reports','Admin,Management,MIS Executive,Finance'],aud:['Audit Trail','Admin'],cust:['Customers','Admin,MIS Executive,Finance,Sales'],qc:['Quality Control','Admin,MIS Executive,Production'],agt:['MIS Agent','Admin,Management,MIS Executive,Production,Finance,Sales,Store']};
const GRP=[['Overview',['dash','agt']],['Operations',['prod','qc','inv','pur']],['Commercial',['ord','sales','cust']],['Data & Reports',['imp','rep']],['Admin',['aud']]];
const ROLES=['Admin','Management','MIS Executive','Production','Finance','Sales','Store'];
const PERMS={prod:['Admin','MIS Executive','Production'],sale:['Admin','MIS Executive','Finance','Sales'],ord:['Admin','MIS Executive','Sales'],adj:['Admin','MIS Executive','Store'],pur:['Admin','MIS Executive','Finance','Store'],cu:['Admin','MIS Executive','Finance','Sales'],qc:['Admin','MIS Executive','Production'],imp:['Admin','MIS Executive'],pay:['Admin','MIS Executive','Finance'],adv:['Admin','MIS Executive','Sales','Production'],dispatch:['Admin','MIS Executive','Sales'],rcv:['Admin','MIS Executive','Finance','Store']};
const can=action=>(PERMS[action]||[]).includes(role);
function seed(){let r=7;const R=()=>(r=(r*9301+49297)%233280)/233280;
 const P=[['FAB-A','Suiting Fabric A',6000],['FAB-B','Uniform Fabric B',5000],['FAB-C','Polyester Grey C',4000],['FAB-D','Fancy Suiting D',3000]];
 const C=['Shree Textiles','Mehta Garments','Oswal Traders','Jain Uniforms','Royal Fabrics'];
 const s={products:P.map(p=>({sku:p[0],name:p[1],reorder:p[2]})),customers:C,tx:[],sales:[],orders:[],purchases:[],audit:[],n:100};
 P.forEach((p,i)=>s.tx.push({d:dAgo(15),sku:p[0],type:'OPEN',qty:[9000,8000,3500,6000][i],ref:'Opening'}));
 for(let d=14;d>=0;d--)P.forEach(p=>{const q=Math.round((2500+R()*2500)/50)*50;s.tx.push({d:dAgo(d),sku:p[0],type:'PROD',qty:q,ref:'B-'+dAgo(d).slice(5).replace('-','')+p[0].slice(-1)});
  if(R()>.25){const sq=Math.round((1800+R()*3200)/50)*50,rt=[185,140,95,260][P.indexOf(p)];s.tx.push({d:dAgo(d),sku:p[0],type:'SALE',qty:-sq,ref:'INV-'+(s.n++)});s.sales.push({id:'INV-'+(s.n-1),d:dAgo(d),cust:C[Math.floor(R()*5)],sku:p[0],qty:sq,rate:rt,paid:R()>.4})}});
 ['New','Confirmed','Production','Ready','Dispatched'].forEach((st,i)=>{for(let k=0;k<2;k++){const sku=P[(i+k)%4][0];s.orders.push({id:'SO-'+(1000+i*2+k),cust:C[(i+k)%5],sku,qty:1000*(k+1)+500*i,rate:{'FAB-A':185,'FAB-B':140,'FAB-C':95,'FAB-D':260}[sku],st})}});
 s.purchases=[{id:'PO-501',d:dAgo(6),sup:'Reliance Yarn',mat:'Polyester Yarn',qty:8000,rate:78,st:'Received'},{id:'PO-502',d:dAgo(2),sup:'Dye Chem Co',mat:'Dyes',qty:1200,rate:340,st:'Pending'}];
 return s}
function prepareData(){S.qc=S.qc||[];if(!S.qc.length)S.qc=S.tx.filter(t=>t.type=='PROD').slice(-24).map((t,i)=>({d:t.d,b:t.ref,sku:t.sku,ins:t.qty,rej:Math.round(t.qty*(0.008+((i*7)%5)/250))}));S.orders.forEach(o=>{if(!o.rate)o.rate={'FAB-A':185,'FAB-B':140,'FAB-C':95,'FAB-D':260}[o.sku]||0})}
function load(){try{S=JSON.parse(localStorage.getItem('ssmis2'))}catch(e){}if(!S)S=seed();prepareData()}
const apiHeaders=()=>({'Content-Type':'application/json',Authorization:`Bearer ${currentUser?.token||''}`});
function save(){const data=JSON.stringify(S);try{localStorage.setItem('ssmis2',data)}catch(e){}if(currentUser?.token&&localApi)fetch('/api/mis/state',{method:'PUT',headers:apiHeaders(),body:data}).catch(e=>console.error('Local database save failed',e))}
async function syncDatabase(){if(!localApi||!currentUser?.token)return true;try{const response=await fetch('/api/mis/state',{headers:apiHeaders()});if(!response.ok){sessionStorage.removeItem('ssmis2.session');showLogin();return false}const result=await response.json();if(result.state){S=result.state;prepareData();try{localStorage.setItem('ssmis2',JSON.stringify(S))}catch(e){}}else{const saved=await fetch('/api/mis/state',{method:'PUT',headers:apiHeaders(),body:JSON.stringify(S)});if(!saved.ok)return false}return true}catch(e){console.error('Local database is unavailable',e);return false}}
const log=m=>{S.audit.unshift({t:new Date().toLocaleString('en-IN'),u:currentUser?`${currentUser.username} (${role})`:role,m});save()};
const stock=k=>S.tx.filter(t=>t.sku==k).reduce((a,t)=>a+t.qty,0);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length}>No data</td></tr>`}</table></div>`;
function lines(lb,ser){const W=600,H=170,m=26,mx=Math.max(...ser.flatMap(s=>s.v))*1.1||1,cs=['var(--ac)','var(--ok)'];
 const x=i=>m+i*(W-m-6)/(lb.length-1),pt=(v,i)=>[x(i),H-m-(v/mx)*(H-m-8)];
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${ser.map((s,j)=>`<polyline fill="none" stroke="${cs[j]}" stroke-width="2" points="${s.v.map((v,i)=>pt(v,i).join(',')).join(' ')}"/>`).join('')}${lb.map((l,i)=>i%2?'':`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l.slice(5)}</text>`).join('')}<text x="2" y="12">${num(mx)} m</text></svg><div style="font-size:12px"><span style="color:var(--ac)">● ${ser[0].n}</span> &nbsp;<span style="color:var(--ok)">● ${ser[1].n}</span></div>`}
function bars(items){const mx=Math.max(...items.map(i=>i.v),1);return items.map(i=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between"><span>${i.l}</span><b class="${i.c||''}">${i.t}</b></div><div style="height:8px;background:var(--bd);border-radius:5px"><div style="height:8px;width:${Math.min(100,i.v/mx*100)}%;background:${i.c=='er'?'var(--er)':'var(--ac)'};border-radius:5px"></div></div></div>`).join('')}
const pname=k=>(S.products.find(p=>p.sku==k)||{}).name||k;
function csv(name,h,rows){const t=[h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';a.click()}
const V={
dash(){const days=[...Array(14)].map((_,i)=>dAgo(13-i));const pd=days.map(d=>sum(S.tx.filter(t=>t.d==d&&t.type=='PROD'),t=>t.qty)),sd=days.map(d=>sum(S.sales.filter(s=>s.d==d),s=>s.qty));
 const tp=pd[13],sv=sum(S.sales.filter(s=>s.d>=dAgo(29)),s=>s.qty*s.rate),tot=sum(S.products,p=>stock(p.sku)),rec=sum(S.sales.filter(s=>!s.paid),s=>s.qty*s.rate),open=S.orders.filter(o=>o.st!='Dispatched'&&o.st!='Delivered').length,low=S.products.filter(p=>stock(p.sku)<p.reorder);
 const cu={};S.sales.forEach(s=>cu[s.cust]=(cu[s.cust]||0)+s.qty*s.rate);const top=Object.entries(cu).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const stg=['New','Confirmed','Production','Ready','Dispatched'].map(s=>({l:s,v:S.orders.filter(o=>o.st==s).length,t:S.orders.filter(o=>o.st==s).length}));
 return `<div class="grid">${[['Today production',num(tp)+' m'],['Sales (30d)',inr(sv)],['Stock on hand',num(tot)+' m'],['Open orders',open],['Receivables',inr(rec)],['Low-stock SKUs',low.length]].map(k=>`<div class="card k"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
 <div class="g2"><div class="card"><h3>Production vs Dispatch (14 days)</h3>${lines(days,[{n:'Production',v:pd},{n:'Dispatch',v:sd}])}</div>
 <div class="card"><h3>Stock vs reorder level</h3>${bars(S.products.map(p=>{const s=stock(p.sku);return{l:p.name,v:s,t:num(s)+' / '+num(p.reorder),c:s<p.reorder?'er':''}}))}</div></div>
 <div class="g2"><div class="card"><h3>Order pipeline</h3>${bars(stg)}</div><div class="card"><h3>Top customers (30d)</h3>${bars(top.map(c=>({l:c[0],v:c[1],t:inr(c[1])})))}</div>
 <div class="card"><h3>Alerts</h3>${low.map(p=>`<p class="er">⚠ ${p.name}: ${num(stock(p.sku))} m (reorder ${num(p.reorder)})</p>`).join('')||'<p class="ok">All stock healthy</p>'}${S.purchases.filter(p=>p.st=='Pending').map(p=>`<p class="wa">⏳ ${p.id} ${p.mat} pending</p>`).join('')}</div></div>`},
prod(){return`<div class="card">${tbl(['Date','Batch','Product','Qty (m)'],S.tx.filter(t=>t.type=='PROD').slice().reverse().slice(0,40).map(t=>[t.d,t.ref,pname(t.sku),num(t.qty)]))}</div>`},
inv(){const raw={};S.purchases.filter(p=>p.st=='Received').forEach(p=>raw[p.mat]=(raw[p.mat]||0)+p.qty);return`<div class="grid">${S.products.map(p=>{const s=stock(p.sku);return`<div class="card k"><small>${p.name}</small><b class="${s<p.reorder?'er':''}">${num(s)} m</b></div>`}).join('')}</div><div class="card"><h3>Finished goods ledger</h3>${tbl(['Date','Type','Product','Qty','Ref'],S.tx.slice().reverse().slice(0,50).map(t=>[t.d,`<span class=tag>${t.type}</span>`,pname(t.sku),(t.qty>0?'+':'')+num(t.qty),t.ref]))}</div><div class="card"><h3>Received raw materials</h3>${tbl(['Material','Received quantity'],Object.entries(raw).map(([mat,qty])=>[mat,num(qty)]))}</div>`},
sales(){return`<div class="card">${tbl(['Invoice','Date','Customer','Product','Qty','Rate','Amount','Payment'],S.sales.slice().reverse().slice(0,40).map(s=>[s.id,s.d,s.cust,pname(s.sku),num(s.qty),s.rate,inr(s.qty*s.rate),s.paid?'<span class=ok>Paid</span>':`<button class="b g" onclick="pay('${s.id}')">Mark paid</button>`]))}</div>`},
ord(){const nx={New:'Confirmed',Confirmed:'Production',Production:'Ready',Ready:'Dispatched'};return`<div class="card">${tbl(['Order','Customer','Product','Qty','Rate','Amount','Status',''],S.orders.map(o=>[o.id,o.cust,pname(o.sku),num(o.qty),inr(o.rate||0),inr(o.qty*(o.rate||0)),`<span class=tag>${o.st}</span>`,nx[o.st]&&can('adv')&&(o.st!='Ready'||can('dispatch'))?`<button class="b g" onclick="adv('${o.id}')">→ ${nx[o.st]}</button>`:'']))}</div>`},
pur(){return`<div class="card">${tbl(['PO','Date','Supplier','Material','Qty','Amount','Status',''],S.purchases.map(p=>[p.id,p.d,p.sup,p.mat,num(p.qty),inr(p.qty*p.rate),`<span class=tag>${p.st}</span>`,p.st=='Pending'?`<button class="b g" onclick="rcv('${p.id}')">Receive</button>`:'']))}</div>`},
imp(){return`<div class="card"><h3>Paste CSV from Excel (columns: date,sku,qty,batch)</h3><textarea id="csvin">date,sku,qty,batch\n${today},FAB-A,3000,B-NEW1\n${today},FAB-X,2000,B-NEW2\n2026-13-45,FAB-B,1500,B-NEW3\n${today},FAB-C,-50,B-NEW4</textarea><p><button class="b" onclick="vimp()">Validate</button></p><div id="imres"></div></div>`},
rep(){const m=S.sales.filter(s=>s.d>=dAgo(29)),pr=S.tx.filter(t=>t.type=='PROD'&&t.d==today);
 const txt=`DAILY MIS — ${today}\nProduction: ${num(sum(pr,t=>t.qty))} m\nDispatch today: ${num(sum(S.sales.filter(s=>s.d==today),s=>s.qty))} m\nStock: ${S.products.map(p=>p.name+' '+num(stock(p.sku))).join(' | ')}\nSales 30d: ${inr(sum(m,s=>s.qty*s.rate))}\nReceivables: ${inr(sum(S.sales.filter(s=>!s.paid),s=>s.qty*s.rate))}\nLow stock: ${S.products.filter(p=>stock(p.sku)<p.reorder).map(p=>p.name).join(', ')||'None'}`;
 return`<div class="card"><h3>Daily MIS summary (copy-paste ready)</h3><textarea id="rt" readonly style="min-height:150px">${txt}</textarea><p><button class="b" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#rt').value)">Copy</button> <button class="b g" onclick="print()">Print / PDF</button></p></div>
 <div class="card"><h3>Export CSV</h3><button class="b g" onclick="ex('production')">Production</button> <button class="b g" onclick="ex('ledger')">Stock ledger</button> <button class="b g" onclick="ex('sales')">Sales</button> <button class="b g" onclick="ex('orders')">Orders</button> <button class="b g" onclick="ex('purchases')">Purchases</button></div>`},
aud(){return`<div class="card">${tbl(['Time','User','Action'],S.audit.slice(0,60).map(a=>[a.t,a.u,a.m]))}</div>`}};
const avgD=k=>sum(S.sales.filter(s=>s.sku==k&&s.d>=dAgo(13)),s=>s.qty)/14,cover=k=>{const a=avgD(k);return a?stock(k)/a:99};
const wk=(a,b)=>sum(S.tx.filter(t=>t.type=='PROD'&&t.d>=dAgo(a)&&t.d<=dAgo(b)),t=>t.qty);
const rejR=()=>{const i=sum(S.qc,q=>q.ins);return i?sum(S.qc,q=>q.rej)/i*100:0};
const recv=()=>sum(S.sales.filter(s=>!s.paid),s=>s.qty*s.rate);
function insights(){const I=[],low=S.products.filter(p=>stock(p.sku)<p.reorder);
 low.forEach(p=>I.push(['er',`${p.name} below reorder (${num(stock(p.sku))} m). Plan ~${num(p.reorder*1.5-stock(p.sku))} m production.`]));
 S.products.forEach(p=>{const c=cover(p.sku);if(c<4&&!low.includes(p))I.push(['wa',`${p.name}: only ${c.toFixed(1)} days of cover at current dispatch rate.`])});
 const w1=wk(6,0),w0=wk(13,7);if(w0){const ch=(w1-w0)/w0*100;I.push([ch<-8?'er':'ok',`Production ${ch>=0?'up':'down'} ${Math.abs(ch).toFixed(1)}% vs previous week.`])}
 const od=S.sales.filter(s=>!s.paid&&s.d<dAgo(7));if(od.length)I.push(['wa',`${od.length} invoices unpaid >7 days, worth ${inr(sum(od,s=>s.qty*s.rate))}.`]);
 if(rejR()>2)I.push(['er',`Rejection rate ${rejR().toFixed(1)}% exceeds 2% target.`]);
 const pp=S.purchases.filter(p=>p.st=='Pending').length;if(pp)I.push(['wa',`${pp} purchase order(s) awaiting receipt.`]);
 if(!I.length)I.push(['ok','All operations normal.']);
 const all=sum(S.sales,s=>s.qty*s.rate),col=all?(all-recv())/all*100:0,ful=S.orders.length?S.orders.filter(o=>o.st=='Dispatched').length/S.orders.length*100:0;
 const K=[['Collection rate',col.toFixed(0)+'%'],['Order fulfilment',ful.toFixed(0)+'%'],['Rejection rate',rejR().toFixed(1)+'%'],['Avg stock cover',(sum(S.products,p=>cover(p.sku))/S.products.length).toFixed(1)+' days']];
 return `<div class="card" style="margin-bottom:12px"><h3>🤖 Agent insights</h3>${I.map(i=>`<p class="${i[0]}" style="margin:4px 0">● ${i[1]}</p>`).join('')}<div class="qa"><button class="b" onclick="go('agt')">Ask the agent</button>${[['prod','+ Production'],['sale','+ Invoice'],['ord','+ Order'],['qc','+ QC check']].filter(a=>can(a[0])).map(a=>`<button class="b g" onclick="openForm('${a[0]}')">${a[1]}</button>`).join('')}</div></div><div class="grid">${K.map(k=>`<div class="card k"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>`}
const d0=V.dash;V.dash=()=>insights()+d0();
V.cust=()=>`<div class="card">${tbl(['Customer','Invoices','Sales','Outstanding','Last invoice'],S.customers.map(c=>{const s=S.sales.filter(x=>x.cust==c),o=sum(s.filter(x=>!x.paid),x=>x.qty*x.rate);return[c,s.length,inr(sum(s,x=>x.qty*x.rate)),`<b class="${o>200000?'er':''}">${inr(o)}</b>`,s.length?s[s.length-1].d:'-']}))}</div>`;
V.qc=()=>`<div class="grid"><div class="card k"><small>Rejection rate</small><b class="${rejR()>2?'er':'ok'}">${rejR().toFixed(2)}%</b></div><div class="card k"><small>Inspected</small><b>${num(sum(S.qc,q=>q.ins))} m</b></div><div class="card k"><small>Rejected</small><b>${num(sum(S.qc,q=>q.rej))} m</b></div></div><div class="card">${tbl(['Date','Batch','Product','Inspected','Rejected','Reject %'],S.qc.slice().reverse().slice(0,40).map(q=>[q.d,q.b,pname(q.sku),num(q.ins),num(q.rej),(q.rej/q.ins*100).toFixed(1)+'%']))}</div>`;
const HI='Hi! I am the MIS Agent. I answer from your live data (rule-based, no external AI). Ask about stock, reorder, sales, receivables, production, orders, quality or forecasts.';
V.agt=()=>`<div class="card"><div id="chat">${(window._ch||[['b',HI]]).map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><input id="q" style="flex:1" placeholder="e.g. which items need reorder?" onkeydown="if(event.key=='Enter')ask()"><button class="b" onclick="ask()">Ask</button></div><div class="qa">${['Daily summary','Low stock','Receivables','Forecast cover','Top customers','Quality','Orders'].map(c=>`<button class="b g" onclick="ask('${c}')">${c}</button>`).join('')}</div></div>`;
function ask(t){const q=t||$('#q').value.trim();if(!q)return;window._ch=window._ch||[['b',HI]];_ch.push(['u',q],['b',agent(q)]);log('Agent query: '+q);go('agt');const c=$('#chat');c.scrollTop=c.scrollHeight}
function agent(q){const l=q.toLowerCase(),B=a=>a.join('<br>');
 if(/low|reorder|shortage|need/.test(l)){const lo=S.products.filter(p=>stock(p.sku)<p.reorder);return lo.length?B(lo.map(p=>`⚠ ${p.name}: ${num(stock(p.sku))} m (reorder ${num(p.reorder)}). Suggest producing ~${num(p.reorder*1.5-stock(p.sku))} m.`)):'All SKUs are above reorder level.'}
 if(/forecast|cover|runout|days/.test(l))return B(S.products.map(p=>`${p.name}: ${cover(p.sku).toFixed(1)} days cover (avg dispatch ${num(avgD(p.sku))} m/day)`));
 if(/receiv|outstanding|due|payment|unpaid/.test(l)){const o={};S.sales.filter(s=>!s.paid).forEach(s=>o[s.cust]=(o[s.cust]||0)+s.qty*s.rate);return B([`Total receivables: <b>${inr(recv())}</b>`,...Object.entries(o).sort((a,b)=>b[1]-a[1]).map(e=>`${e[0]}: ${inr(e[1])}`)])}
 if(/top|best|customer/.test(l)){const c={};S.sales.forEach(s=>c[s.cust]=(c[s.cust]||0)+s.qty*s.rate);return B(Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5).map((e,i)=>`${i+1}. ${e[0]} — ${inr(e[1])}`))}
 if(/stock|inventory/.test(l))return B(S.products.map(p=>`${p.name}: ${num(stock(p.sku))} m`));
 if(/sale|revenue/.test(l)){const m=S.sales.filter(s=>s.d>=dAgo(29));return B([`Sales (30d): <b>${inr(sum(m,s=>s.qty*s.rate))}</b>`,...S.products.map(p=>`${p.name}: ${inr(sum(m.filter(s=>s.sku==p.sku),s=>s.qty*s.rate))}`)])}
 if(/produc/.test(l)){const a=wk(6,0),b=wk(13,7);return B([`Today: ${num(wk(0,0))} m`,`Last 7 days: ${num(a)} m (${b?((a-b)/b*100).toFixed(1):0}% vs previous week)`])}
 if(/order|pending|pipeline/.test(l))return B(['New','Confirmed','Production','Ready','Dispatched'].map(s=>`${s}: ${S.orders.filter(o=>o.st==s).length}`));
 if(/reject|quality|qc/.test(l))return `Rejection rate is <b>${rejR().toFixed(2)}%</b> across ${num(sum(S.qc,q=>q.ins))} m inspected.`;
 if(/summary|brief|report|today/.test(l))return B([`Production today: ${num(wk(0,0))} m`,`Stock: ${num(sum(S.products,p=>stock(p.sku)))} m`,`Receivables: ${inr(recv())}`,`Low stock: ${S.products.filter(p=>stock(p.sku)<p.reorder).map(p=>p.name).join(', ')||'None'}`,`Rejection: ${rejR().toFixed(1)}%`]);
 return 'Try: low stock, forecast cover, receivables, top customers, sales, production, orders, quality, daily summary.'}
function ex(k){const M={production:[['Date','Batch','SKU','Qty'],S.tx.filter(t=>t.type=='PROD').map(t=>[t.d,t.ref,t.sku,t.qty])],ledger:[['Date','Type','SKU','Qty','Ref'],S.tx.map(t=>[t.d,t.type,t.sku,t.qty,t.ref])],sales:[['Invoice','Date','Customer','SKU','Qty','Rate','Paid'],S.sales.map(s=>[s.id,s.d,s.cust,s.sku,s.qty,s.rate,s.paid])],orders:[['Order','Customer','SKU','Qty','Status'],S.orders.map(o=>[o.id,o.cust,o.sku,o.qty,o.st])],purchases:[['PO','Date','Supplier','Material','Qty','Rate','Status'],S.purchases.map(p=>[p.id,p.d,p.sup,p.mat,p.qty,p.rate,p.st])]}[k];csv(k,...M);log('Exported '+k)}
function pay(id){if(!can('pay'))return;const sale=S.sales.find(s=>s.id==id);if(!sale||sale.paid)return;sale.paid=true;log('Payment received '+id);go(view)}
function adv(id){if(!can('adv'))return;const o=S.orders.find(x=>x.id==id),nx={New:'Confirmed',Confirmed:'Production',Production:'Ready',Ready:'Dispatched'};if(!o||!nx[o.st])return;if(o.st=='Ready'){if(!can('dispatch'))return;if(o.qty>stock(o.sku)){alert('Insufficient stock to dispatch this order.');return}const invoice='INV-'+(S.n++),rate=+o.rate||{'FAB-A':185,'FAB-B':140,'FAB-C':95,'FAB-D':260}[o.sku]||0;S.sales.push({id:invoice,d:today,cust:o.cust,sku:o.sku,qty:o.qty,rate,paid:false,order:o.id});S.tx.push({d:today,sku:o.sku,type:'SALE',qty:-o.qty,ref:invoice});o.invoice=invoice}o.st=nx[o.st];log(id+' → '+o.st+(o.invoice?' · '+o.invoice:''));go(view)}
function rcv(id){if(!can('rcv'))return;const p=S.purchases.find(x=>x.id==id);if(!p||p.st!='Pending')return;p.st='Received';log('Received '+id);go(view)}
function vimp(){if(!can('imp'))return;const L=$('#csvin').value.trim().split('\n').slice(1),seen=new Set(S.tx.map(t=>t.ref)),ok=[];const rows=L.map((l,i)=>{const[d,sku,q,b]=l.split(',').map(x=>x.trim()),e=[];
 if(!validDate(d))e.push('invalid date');if(!S.products.some(p=>p.sku==sku))e.push('unknown SKU');if(!(+q>0))e.push('qty must be >0');if(!b)e.push('batch missing');else if(seen.has(b))e.push('duplicate batch');else seen.add(b);
 if(!e.length)ok.push({d,sku,q:+q,b});return[i+2,d,sku,q,b,e.length?`<span class=er>${e.join(', ')}</span>`:'<span class=ok>OK</span>']});
 window._ok=ok;$('#imres').innerHTML=tbl(['Row','Date','SKU','Qty','Batch','Result'],rows)+`<p>${ok.length} valid / ${rows.length-ok.length} rejected <button class="b" onclick="cimp()" ${ok.length?'':'disabled'}>Import valid rows</button></p>`}
function cimp(){if(!can('imp'))return;(window._ok||[]).forEach(r=>S.tx.push({d:r.d,sku:r.sku,type:'PROD',qty:r.q,ref:r.b}));log('Imported '+(window._ok||[]).length+' production rows');go('prod')}
const FORMS={prod:{t:'New production entry',f:[['d','Date','date',today],['sku','Product','sku'],['q','Quantity (m)','number'],['b','Batch no.','text']],ok(v){if(!(v.q>0)||!v.b)return'Enter qty and batch';if(S.tx.some(t=>t.ref==v.b))return'Duplicate batch';S.tx.push({d:v.d,sku:v.sku,type:'PROD',qty:+v.q,ref:v.b});log('Production '+v.b+' '+v.q+'m')}},
 sale:{t:'New invoice',f:[['d','Date','date',today],['cust','Customer','cust'],['sku','Product','sku'],['q','Quantity (m)','number'],['r','Rate ₹/m','number']],ok(v){if(!(v.q>0)||!(v.r>0))return'Enter qty and rate';if(+v.q>stock(v.sku))return'Insufficient stock: '+num(stock(v.sku))+' m';const id='INV-'+(S.n++);S.sales.push({id,d:v.d,cust:v.cust,sku:v.sku,qty:+v.q,rate:+v.r,paid:false});S.tx.push({d:v.d,sku:v.sku,type:'SALE',qty:-v.q,ref:id});log('Invoice '+id)}},
 ord:{t:'New order',f:[['cust','Customer','cust'],['sku','Product','sku'],['q','Quantity (m)','number'],['r','Rate ₹/m','number',185]],ok(v){if(!(v.q>0)||!(v.r>0))return'Enter quantity and rate';const id='SO-'+(1000+S.orders.length);S.orders.push({id,cust:v.cust,sku:v.sku,qty:+v.q,rate:+v.r,st:'New'});log('Order '+id)}},
 adj:{t:'Stock adjustment',f:[['sku','Product','sku'],['q','Qty (+/−)','number'],['b','Reason','text']],ok(v){if(!+v.q||!v.b)return'Enter qty and reason';S.tx.push({d:today,sku:v.sku,type:'ADJ',qty:+v.q,ref:v.b});log('Adjustment '+v.q+' '+v.sku+': '+v.b)}},
 pur:{t:'New purchase order',f:[['sup','Supplier','text'],['mat','Material','text'],['q','Quantity','number'],['r','Rate ₹','number']],ok(v){if(!v.sup||!(v.q>0))return'Fill all fields';S.purchases.push({id:'PO-'+(501+S.purchases.length),d:today,sup:v.sup,mat:v.mat,qty:+v.q,rate:+v.r||0,st:'Pending'});log('PO created')}}};
function openForm(k){if(!can(k))return;const F=FORMS[k];if(!F)return;$('#mc').innerHTML=`<h3>${F.t}</h3>`+F.f.map(f=>`<label>${f[1]}</label>`+(f[2]=='sku'?`<select id="f_${f[0]}">${S.products.map(p=>`<option value="${p.sku}">${p.name}</option>`).join('')}</select>`:f[2]=='cust'?`<select id="f_${f[0]}">${S.customers.map(c=>`<option>${c}</option>`).join('')}</select>`:`<input id="f_${f[0]}" type="${f[2]}" value="${f[3]||''}">`)).join('')+`<p id="fe" class="er"></p><button class="b" id="fs">Save</button> <button class="b g" onclick="$('#modal').style.display='none'">Cancel</button>`;
 $('#modal').style.display='flex';$('#fs').onclick=()=>{const v={};F.f.forEach(f=>v[f[0]]=$('#f_'+f[0]).value);const e=F.ok(v);if(e){$('#fe').textContent=e;return}save();$('#modal').style.display='none';go(view)}}
const ACT={prod:[['prod','+ Production entry']],inv:[['adj','Stock adjustment']],sales:[['sale','+ Invoice']],ord:[['ord','+ Order']],pur:[['pur','+ Purchase order']]};
function showLogin(){currentUser=null;role='';$('#app').style.display='none';$('#login').innerHTML=`<div class="login-wrap"><form class="login-box" onsubmit="event.preventDefault();login()"><h1>Sukh Sagar MIS</h1><p>Bhilwara · Synthetic Fabrics · Local demo</p><label for="loginUser">Username</label><input id="loginUser" autocomplete="username" required><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><p id="loginError" class="er" role="alert"></p><button class="b" type="submit">Sign in</button><details class="login-demo"><summary>Demo accounts</summary><p>admin / admin123 · management / manage123 · mis / mis123</p><p>production / prod123 · finance / finance123 · sales / sales123 · store / store123</p></details></form></div>`}
async function login(){const username=$('#loginUser').value.trim().toLowerCase(),password=$('#loginPassword').value,account=ACCOUNTS[username];let token='',refreshToken='';if(!account||account.password!==password){$('#loginError').textContent='Username or password is incorrect.';return}if(localApi){try{const response=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:`${username}@ssmis.demo`,password})});const payload=await response.json();if(!response.ok){$('#loginError').textContent=payload.message||'Username or password is incorrect.';return}token=payload.data.access_token;refreshToken=payload.data.refresh_token}catch(e){$('#loginError').textContent='Local server is unavailable. Start it with npm start.';return}}currentUser={username,name:account.name,role:account.role,token,refreshToken};role=account.role;if(!await syncDatabase()){if($('#loginError'))$('#loginError').textContent='Could not connect to the local database.';return}sessionStorage.setItem('ssmis2.session',JSON.stringify(currentUser));$('#login').innerHTML='';$('#app').style.display='flex';go('dash')}
function logout(){if(currentUser?.token)fetch('/api/v1/auth/logout',{method:'POST',headers:apiHeaders(),body:JSON.stringify({refresh_token:currentUser.refreshToken})}).catch(()=>{});sessionStorage.removeItem('ssmis2.session');showLogin()}
function go(v){if(!currentUser){showLogin();return}view=v;const vis=Object.keys(NAV).filter(k=>NAV[k][1].includes(role));if(!vis.includes(v))view=v=vis[0];
 $('#nav').innerHTML=`<h1>Sukh Sagar MIS<small>Bhilwara · Synthetic Fabrics</small></h1>`+GRP.map(g=>{const ks=g[1].filter(k=>vis.includes(k));return ks.length?`<p>${g[0]}</p>`+ks.map(k=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${NAV[k][0]}</button>`).join(''):''}).join('');
 $('#ttl').textContent=NAV[v][0];$('#act').innerHTML=`<span style="align-self:center;color:var(--mu)">${currentUser.name} · ${role}</span> <button class="b g" onclick="logout()">Sign out</button>`+(ACT[v]||[]).filter(a=>can(a[0])).map(a=>`<button class="b" onclick="openForm('${a[0]}')">${a[1]}</button>`).join('');
 $('#v').innerHTML=V[v]()}
FORMS.qc={t:'New QC inspection',f:[['d','Date','date',today],['b','Batch no.','text'],['sku','Product','sku'],['i','Inspected (m)','number'],['j','Rejected (m)','number']],ok(v){if(!(v.i>0)||!v.b)return'Enter batch and inspected qty';if(!(+v.j>=0)||+v.j>+v.i)return'Rejected must be between 0 and inspected';S.qc.push({d:v.d,b:v.b,sku:v.sku,ins:+v.i,rej:+v.j});log('QC '+v.b+' rejected '+v.j+'m')}};
FORMS.cu={t:'New customer',f:[['n','Customer name','text']],ok(v){if(!v.n.trim())return'Enter name';if(S.customers.includes(v.n.trim()))return'Customer exists';S.customers.push(v.n.trim());log('Customer added: '+v.n)}};
ACT.qc=[['qc','+ QC inspection']];ACT.cust=[['cu','+ Customer']];
